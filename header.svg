<svg fill="none" width="100%" height="0px" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://w3.org">
      <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing:border-box;  
        }
        .container-tecnologias{
            display: flex;
            flex-direction: row;
            gap: 15px;
            font-family: Arial;
            width: 100%;
            justify-content: space-around;
        }
        .badge figure img {
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: white solid 4px;
            color: #ffffff;
            font-weight: bold;
            transform: scale(1);
            background-color: white;
        }
        figure img {
            transform: scale(2.5);
        }
        #github figure img {
            background-color: white;
            border-radius: 50%;
            padding: 1px;
        }
        figcaption {
            display: block;
        }
      </style>
      <div class="titulo">
        <h1>Meu README Estilizado com CSS!</h1>
      </div>
    </div>
  </foreignObject>
</svg>
